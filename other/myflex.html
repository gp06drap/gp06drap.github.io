<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flexbox Fun</title>
        <style>
            /* Additional styles for fun */
            .flex-container {
                display: flex;
                background-color: lightgray;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                @media (min-width: 900px) {
                    justify-content: center;
                }
            }
            .flex-item {
                display: flex;
                width: 100px;
                height: 100px;
                color: white;
                font-size: 2em;
                justify-content: center;
                align-items: center;
                @media (min-width: 600px) {
                    color: gray;
                }
                @media (min-width: 900px) {
                    color: purple;
                }
            }
            nav {
                background-color: #333;
                display: flex;
                justify-content: space-around;
                align-items: center;
            }
            .nav-links {
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                list-style-type: none;
                flex: 1;
                @media (max-width: 900px) @media(min-width: 600){} {
                    height: 100vh;
                    flex-direction: column;
                    align-items: space-between;
                }}
            }
            .logo {
                font-size: 24px;
            }
            nav a {
                color: white;
                text-decoration: none;
            }
            nav a:hover {
                background-color: #999;
            }
            .red {
                background: tomato;
            }
            .blue {
                background: dodgerblue;
            }
            .green {
                background: mediumseagreen;
            }
            .orange {
                background: orange;
            }
            .purple {
                background: rebeccapurple;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>FlexBox practice</h1>
            <nav class="site-nav">
                <div class="logo">MySite</div>
                <ul class="nav-links">
                    <li><a href="myflex.html">Flex</a></li>
                    <li><a href="layout.html">Layout</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="flex-container">
                <div class="flex-item red">1</div>
                <div class="flex-item blue">2</div>
                <div class="flex-item green">3</div>
                <div class="flex-item orange">4</div>
                <div class="flex-item purple">5</div>
            </section>
        </main>
        <footer>
            <p>Do we need this?</p>
        </footer>
    </body>
</html>
<!-- GOAL (initially): use INLINE styles to make width/height 100px,
text white, and font-size 2em for .flex-item -->
