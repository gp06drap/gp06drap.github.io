<html>
    <head>
        <title>Lab 6 Timers and Forms</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <center>
            <div id="stopWatch"></div>
            <button id="startStop">Start</button>
        </center>
        <br>
        <br>
        <form id="sienaForm">
            <label for="emailAddress">Siena University Email:</label>
            <input type="email" id="emailAddress" placeholder="Enter your Siena email" required pattern=".+@siena\.edu" title="Please enter a valid Siena University email ending with @siena.edu">
            <label for="sienaID">Siena ID:</label>
            <input type="number" id="sienaID" placeholder="Enter your Siena ID" required min="90200000" maxx="90299999" title="Siena ID must be 8 digits starting with 902">
            <button type="submit">Submit</button>
        </form>
        <main class="container">
            <form id="finances">
            <label for="incomeSourceName">Income Source Name: </label>
            <input type="text" id="incomeSourceName" name="incomeSourceName" required pattern="[A-z ]{3,}">
            <br>
            <label for="incomeAmount">Amount: </label>
            <input type="number" id="incomeAmount" name="incomeAmount" required min="0.01" step=".01">
            <br>
            <label for="frequency">Frequency: </label>
            <select id="frequency" name="frequency" required>
                <option>One Time</option>
                <option>Monthly</option>
                <option>Bi-Weekly</option>
                <option>Yearly</option>
            </select>
            <button type="submit">Submit</button>
        </form>
        </main>
        <script src="script.js" defer></script>
        <script>
            let running=false;
            let timerId;
            let count=0;
            document.getElementById("startStop").addEventListener("click", function(){
                if(!running){
                    running=true;
                    this.textContent="Stop";
                    timerId=setInterval(()=>{
                        count++;
                        if(count%10==0){
                            document.getElementById("stopWatch").textContent=count/10+".0";
                        }else{
                            document.getElementById("stopWatch").textContent=count/10;
                        }
                    },100);
                }else{
                    running=false;
                    this.textContent="Start";
                    clearInterval(timerId);
                    timerId=null;
                    count=0;
                }
            });
        </script>
    </body>
</html>
