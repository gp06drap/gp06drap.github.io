<html>
    <head>
        <title>Lab 6 Timers and Forms</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <center>
            <div id="stopWatch"></div>
            <button id="startStop">Start</button>
        </center>
        <br>
        <br>
        <form id="sienaForm">
            <label for="emailAddress">Siena University Email:</label>
            <input type="email" id="emailAddress" placeholder="Enter your Siena email" required pattern=".+@siena\.edu" title="Please enter a valid Siena University email ending with @siena.edu">
            <label for="sienaID">Siena ID:</label>
            <input type="number" id="sienaID" placeholder="Enter your Siena ID" required min="90200000" maxx="90299999" title="Siena ID must be 8 digits starting with 902">
            <button type="submit">Submit</button>
        </form>
        <main class="container">
            <h1>Finances Form</h1>
            <form id="finances">
            <div class="row"><label for="incomeSourceName" class="col-3">Income Source Name: </label>
            <input type="text" id="incomeSourceName" name="incomeSourceName" required pattern="[A-z ]{3,}" class="col-4"></div>
            <div class="row"><label for="incomeAmount" class="col-3">Amount: </label>
            <input type="number" id="incomeAmount" name="incomeAmount" required min="0.01" step=".01" class="col-4"></div>
            <div class="row"><label for="frequency" class="col-3">Frequency: </label>
            <select id="frequency" name="frequency" required class="col-4">
                <option>One Time</option>
                <option>Monthly</option>
                <option>Bi-Weekly</option>
                <option>Yearly</option>
            </select></div>
            <div class="row"><label for="expenseName" class="col-3">Expense Name: </label>
            <input type="text" id="expenseName" name="expenseName" required pattern="[A-z ]{5,}" class="col-4"></div>
            <div class="row"><label for="expenseDate" class="col-3">Income Source Name: </label>
            <input type="date" id="expenseDate" name="expenseDate" required max="03-11-2026" class="col-4"></div>
            <div class="row"><label for="expenseAmount" class="col-3">Expense Amount: </label>
            <input type="number" id="expenseAmount" name="expenseAmount" required min="0" max="5000" class="col-4"></div>
            <div class="row"><label class="col=3">Expense Catagory:</label></div>
            <input type="radio" name="catagory" id="groceries" value="groceries">
            <label for="groceries">Groceries</label>
            <input type="radio" name="catagory" id="business" value="business">
            <label for="business">Business</label>
            <input type="radio" name="catagory" id="restaurants" value="restaurants">
            <label for="restaurants">Restaurants</label>
            <input type="radio" name="catagory" id="fun" value="fun">
            <label for="fun">Fun!</label><br>
            <div class="row"><label class="col=3">Payment Type:</label></div>
            <input type="radio" name="paymentType" id="creditCard" value="creditCard">
            <label for="creditCard">Credit Card</label>
            <input type="radio" name="paymentType" id="debitCard" value="debitCard">
            <label for="debitCard">Debit Card</label>
            <input type="radio" name="paymentType" id="cash" value="cash">
            <label for="cash">Cash</label>
            <input type="radio" name="paymentType" id="check" value="check">
            <label for="check">Check</label><br>
            <div class="row"><label for="reason" class="col-3">Explain why this purchase was necassary: </label>
            <textarea name="reason" id="reason" maxlength="100" class="col-4"></textarea></div>
            <button type="submit">Submit</button>
        </form>
        </main>
        <script src="script.js" defer></script>
        <script>
            let running=false;
            let timerId;
            let count=0;
            document.getElementById("startStop").addEventListener("click", function(){
                if(!running){
                    running=true;
                    this.textContent="Stop";
                    timerId=setInterval(()=>{
                        count++;
                        if(count%10==0){
                            document.getElementById("stopWatch").textContent=count/10+".0";
                        }else{
                            document.getElementById("stopWatch").textContent=count/10;
                        }
                    },100);
                }else{
                    running=false;
                    this.textContent="Start";
                    clearInterval(timerId);
                    timerId=null;
                    count=0;
                }
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
