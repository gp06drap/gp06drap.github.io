<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Conclusion</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section class="container">
            <h1>Your Quest Has Concluded</h1>
            <h2>For now!</h2>
            <p>Based on your choices, [Insert a dynamic conclusion based on the user's journey and final decision]. The kingdom will remember your deeds for generations to come.</p>
            <p>We hope you enjoyed your adventure. Would you like to provide feedback on your experience?</p>
            <form id="feedback">
                <label for="userFeedback">Your Feedback: </label>
                <textarea name="userFeedback" id="userFeedback" style="height:4rem;width:50%;" placeholder="Enter your feedback here..."></textarea>
                <br>
                <button type="submit">Submit Feedback</button>
            </form>
            <button onclick="location.href='welcome.html'">Play Again</button>
        </section>
    </body>
</html>
