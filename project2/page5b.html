<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Path of Stealth</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section class="container">
            <h1>The Path of Stealth</h1>
            <p>To successfully navigate the Path of Stealth, you must choose your actions carefully. Select the correct sequence of actions to avoid detection and reach your objective.</p>
            <!-- Actions -->
            <div class="stealth-option" id="hide">Hide in the shadows</div>
            <div class="stealth-option" id="run">Run quickly to the next cover</div>
            <div class="stealth-option" id="distract">Create a distraction</div>
            <div class="stealth-option" id="wait">Wait for the right moment</div>
            <!-- Buttons -->
            <button onclick="checkSequence()">Check Sequence</button>
            <button onclick="reset()">Reset!</button>
            <script>
                const correctSequence = ['hide', 'wait', 'distract'];
                let userSequence=[];
                document.getElementById("hide").addEventListener("click", function(){
                    if(!userSequence.includes("hide")){
                        userSequence.push("hide");
                    }
                    this.style.backgroundColor="green";
                    this.style.color="white";
                });
                document.getElementById("run").addEventListener("click", function(){
                    if(!userSequence.includes("run")){
                        userSequence.push("run");
                    }
                    this.style.backgroundColor="green";
                    this.style.color="white";
                });
                document.getElementById("distract").addEventListener("click", function(){
                    if(!userSequence.includes("distract")){
                        userSequence.push("distract");
                    }
                    this.style.backgroundColor="green";
                    this.style.color="white";
                });
                document.getElementById("wait").addEventListener("click", function(){
                    if(!userSequence.includes("wait")){
                        userSequence.push("wait");
                    }
                    this.style.backgroundColor="green";
                    this.style.color="white";
                });
                function reset(){
                    while(userSequence.length>0){
                        document.getElementById(userSequence[0]).style.backgroundColor='#f0f0f0';
                        document.getElementById(userSequence[0]).style.color="black";
                        userSequence.splice(0,1);
                    }
                }
                function checkSequence(){
                    if(userSequence.join()==correctSequence.join()){
                        alert("Congratulations, you got the correct order!");
                        location.href="page6.html";
                    }else{
                        reset();
                    }
                }
            </script>
        </section>
    </body>
</html>
