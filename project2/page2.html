<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Character Selection</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section class="container">
            <h1>Choose Your Character</h1>
            <fieldset>
                <legend>Choose You Character</legend>
                <form id="characterForm" type="get">
                    <section class="character">
                        <input type="radio" name="character" id="aria" value="aria">
                        <label for="aria"><b>Aria, the Warrior:</b> Strong and brave, with the ability to overcome physical obstacles.</label>
                    </section>
                    <section class="character">
                        <input type="radio" name="character" id="eldrin" value="eldrin">
                        <label for="eldrin"><b>Eldrin, the Mage:</b> Wise and knowledgeable, with the power to solve puzzels and cast spells.</label>
                    </section>
                    <section class="character">
                        <input type="radio" name="character" id="tara" value="tara">
                        <label for="tara"><b>Tara, the Rouge:</b> Quick and cunning, with skills in stealth and persuasion.</label>
                    </section>
                    <button type="submit" onclick="action='page3.html'">Continue</button>
                </form>
            </fieldset>
        </section>
    </body>
</html>
